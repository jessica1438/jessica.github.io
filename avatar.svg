<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0c0515" stop-opacity="0"/>
    </radialGradient>
    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <!-- Skin gradient -->
    <linearGradient id="skinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c4956a"/>
    </linearGradient>
    <!-- Skin shadow -->
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="100%" stop-color="#b8895e"/>
    </linearGradient>
    <!-- Top gradient (purple) -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <!-- Top highlight -->
    <linearGradient id="topHighlight" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <!-- Lip color -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4756a"/>
      <stop offset="100%" stop-color="#b8695e"/>
    </linearGradient>
    <!-- Eye shine -->
    <radialGradient id="eyeShine" cx="35%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Glow filter -->
    <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#0c0515" rx="0"/>
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- Neck -->
  <rect x="172" y="255" width="56" height="45" rx="5" fill="url(#skinGrad)"/>
  <!-- Neck shadow -->
  <ellipse cx="200" cy="260" rx="28" ry="8" fill="#b8895e" opacity="0.3"/>

  <!-- Shoulders & Top (Purple) -->
  <path d="M 105 340 Q 105 290 155 280 L 170 275 Q 200 268 230 275 L 245 280 Q 295 290 295 340 L 295 400 L 105 400 Z" fill="url(#topGrad)" filter="url(#softShadow)"/>
  <!-- Top highlight -->
  <path d="M 105 340 Q 105 290 155 280 L 170 275 Q 200 268 230 275 L 245 280 Q 295 290 295 340 L 295 400 L 105 400 Z" fill="url(#topHighlight)"/>
  <!-- Collar/neckline -->
  <path d="M 170 275 Q 185 295 200 298 Q 215 295 230 275" fill="none" stroke="url(#skinGrad)" stroke-width="1.5"/>
  <!-- V-neckline detail -->
  <path d="M 170 275 Q 185 300 200 310 Q 215 300 230 275" fill="url(#skinGrad)"/>

  <!-- Face -->
  <ellipse cx="200" cy="195" rx="72" ry="82" fill="url(#skinGrad)" filter="url(#softShadow)"/>
  <!-- Face contour shadow -->
  <ellipse cx="200" cy="200" rx="70" ry="80" fill="url(#skinShadow)" opacity="0.15"/>

  <!-- Ears -->
  <ellipse cx="128" cy="195" rx="12" ry="16" fill="url(#skinGrad)"/>
  <ellipse cx="128" cy="195" rx="7" ry="10" fill="#c4956a" opacity="0.4"/>
  <ellipse cx="272" cy="195" rx="12" ry="16" fill="url(#skinGrad)"/>
  <ellipse cx="272" cy="195" rx="7" ry="10" fill="#c4956a" opacity="0.4"/>

  <!-- Earrings (small purple dots) -->
  <circle cx="128" cy="212" r="4" fill="#7c3aed"/>
  <circle cx="128" cy="212" r="2.5" fill="#a78bfa"/>
  <circle cx="272" cy="212" r="4" fill="#7c3aed"/>
  <circle cx="272" cy="212" r="2.5" fill="#a78bfa"/>

  <!-- Hair (back layer) -->
  <path d="M 120 170 Q 115 100 160 75 Q 200 55 240 75 Q 285 100 280 170 L 285 230 Q 290 270 280 300 Q 275 310 270 305 Q 275 260 270 220 L 268 195
           L 132 195 L 130 220 Q 125 260 130 305 Q 125 310 120 300 Q 110 270 115 230 Z" fill="url(#hairGrad)"/>

  <!-- Hair (front/top layer) -->
  <path d="M 128 185 Q 120 140 135 105 Q 150 75 180 65 Q 200 58 220 65 Q 250 75 265 105 Q 280 140 272 185
           Q 265 165 250 150 Q 235 140 220 138 Q 200 135 180 138 Q 165 140 150 150 Q 135 165 128 185 Z" fill="url(#hairGrad)"/>

  <!-- Hair highlights/shine -->
  <path d="M 155 80 Q 175 68 200 65 Q 210 65 220 68" fill="none" stroke="#2a2a40" stroke-width="2" opacity="0.5"/>
  <path d="M 145 95 Q 165 78 195 72" fill="none" stroke="#2a2a40" stroke-width="1.5" opacity="0.3"/>

  <!-- Side hair strands -->
  <path d="M 128 185 Q 122 210 118 240 Q 115 260 120 280 Q 122 285 125 282 Q 120 260 122 240 Q 125 215 132 195" fill="url(#hairGrad)" opacity="0.9"/>
  <path d="M 272 185 Q 278 210 282 240 Q 285 260 280 280 Q 278 285 275 282 Q 280 260 278 240 Q 275 215 268 195" fill="url(#hairGrad)" opacity="0.9"/>

  <!-- Eyebrows -->
  <path d="M 163 168 Q 172 162 185 165" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 215 165 Q 228 162 237 168" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <!-- Left eye -->
  <ellipse cx="175" cy="190" rx="16" ry="12" fill="white"/>
  <circle cx="177" cy="190" r="8" fill="#0d0d0d"/>
  <circle cx="177" cy="190" r="5.5" fill="#1a1a1a"/>
  <circle cx="174" cy="187" r="2.5" fill="white" opacity="0.85"/>
  <circle cx="180" cy="192" r="1.2" fill="white" opacity="0.4"/>
  <!-- Left eyelid line -->
  <path d="M 159 186 Q 168 178 185 180 Q 190 182 191 186" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Left lower lash line -->
  <path d="M 162 194 Q 175 200 188 194" fill="none" stroke="#2a2a2e" stroke-width="0.8" opacity="0.4"/>

  <!-- Right eye -->
  <ellipse cx="225" cy="190" rx="16" ry="12" fill="white"/>
  <circle cx="223" cy="190" r="8" fill="#0d0d0d"/>
  <circle cx="223" cy="190" r="5.5" fill="#1a1a1a"/>
  <circle cx="220" cy="187" r="2.5" fill="white" opacity="0.85"/>
  <circle cx="226" cy="192" r="1.2" fill="white" opacity="0.4"/>
  <!-- Right eyelid line -->
  <path d="M 209 186 Q 210 182 215 180 Q 232 178 241 186" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Right lower lash line -->
  <path d="M 212 194 Q 225 200 238 194" fill="none" stroke="#2a2a2e" stroke-width="0.8" opacity="0.4"/>

  <!-- Eyelashes -->
  <path d="M 158 185 Q 155 181 153 178" fill="none" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 242 185 Q 245 181 247 178" fill="none" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 198 200 Q 195 215 190 225 Q 195 228 200 229 Q 205 228 210 225 Q 205 215 202 200" fill="none" stroke="#b8895e" stroke-width="1.2" opacity="0.5"/>
  <!-- Nose tip highlight -->
  <ellipse cx="200" cy="224" rx="5" ry="3" fill="#d4a574" opacity="0.3"/>

  <!-- Lips -->
  <!-- Upper lip -->
  <path d="M 183 242 Q 192 237 200 240 Q 208 237 217 242" fill="url(#lipGrad)" opacity="0.8"/>
  <!-- Lower lip -->
  <path d="M 183 242 Q 192 244 200 252 Q 208 244 217 242" fill="url(#lipGrad)" opacity="0.65"/>
  <!-- Lip line -->
  <path d="M 183 242 Q 192 244 200 242 Q 208 244 217 242" fill="none" stroke="#a8604e" stroke-width="0.8" opacity="0.5"/>
  <!-- Smile hint -->
  <path d="M 182 243 Q 180 246 178 247" fill="none" stroke="#b8895e" stroke-width="0.8" opacity="0.3"/>
  <path d="M 218 243 Q 220 246 222 247" fill="none" stroke="#b8895e" stroke-width="0.8" opacity="0.3"/>

  <!-- Cheek blush -->
  <ellipse cx="155" cy="215" rx="15" ry="8" fill="#c4756a" opacity="0.12"/>
  <ellipse cx="245" cy="215" rx="15" ry="8" fill="#c4756a" opacity="0.12"/>

  <!-- Subtle smile lines -->
  <path d="M 178 245 Q 185 252 192 250" fill="none" stroke="#b8895e" stroke-width="0.5" opacity="0.2"/>
  <path d="M 222 245 Q 215 252 208 250" fill="none" stroke="#b8895e" stroke-width="0.5" opacity="0.2"/>
</svg>